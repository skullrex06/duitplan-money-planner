name: Build DuitPlan Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare offline web app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
      - name: Install Capacitor
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Create branded app icon
        run: |
          mkdir -p assets
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -background none assets/icon.svg -resize 1024x1024 assets/icon.png
      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3B2418' --iconBackgroundColorDark '#3B2418'
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuitPlan-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
