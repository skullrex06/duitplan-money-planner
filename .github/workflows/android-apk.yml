name: Build DuitPlan Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'package.json'
      - 'capacitor.config.json'
      - 'assets/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare offline web app
        run: |
          mkdir -p www
          cp index.html manifest.webmanifest sw.js www/
      - name: Install Capacitor
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Create branded app icon
        run: |
          mkdir -p assets
          echo "Repository revision: $GITHUB_SHA"
          ls -la assets || true
          if [ ! -s assets/icon.svg ]; then
            echo "Custom SVG not found in checkout; creating branded fallback icon."
            cat > assets/icon.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <rect width="1024" height="1024" rx="220" fill="#3B2418"/>
            <rect x="120" y="250" width="784" height="500" rx="90" fill="#F47716" stroke="#FFE0B5" stroke-width="24"/>
            <rect x="620" y="400" width="300" height="180" rx="45" fill="#704326" stroke="#FFCA82" stroke-width="18"/>
            <circle cx="690" cy="490" r="28" fill="#FFD36B"/>
            <text x="340" y="570" text-anchor="middle" font-family="Arial,sans-serif" font-size="150" font-weight="bold" fill="#FFF8E8">RM</text>
            <text x="512" y="880" text-anchor="middle" font-family="Arial,sans-serif" font-size="112" font-weight="bold" fill="#FFF8E8">DuitPlan</text>
          </svg>
          SVG
          fi
          sudo apt-get update
          sudo apt-get install -y imagemagick
          test -s assets/icon.svg
          convert -background none assets/icon.svg -resize 1024x1024 assets/icon.png
          test -s assets/icon.png
          identify assets/icon.png
      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#3B2418' --iconBackgroundColorDark '#3B2418'
      - name: Sync web app
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DuitPlan-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
