<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2B1D"/>
      <stop offset="1" stop-color="#24150F"/>
    </linearGradient>
    <linearGradient id="wallet" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFB24A"/>
      <stop offset="1" stop-color="#F47718"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1C7"/>
      <stop offset="1" stop-color="#F6C96A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#160C08" flood-opacity=".32"/>
    </filter>
  </defs>

  <!-- App tile -->
  <rect width="1024" height="1024" rx="230" fill="url(#background)"/>
  <circle cx="512" cy="512" r="378" fill="none" stroke="#F5A33A" stroke-width="12" opacity=".16"/>

  <!-- Wallet -->
  <g filter="url(#shadow)">
    <path d="M258 378c0-66 54-120 120-120h344c57 0 104 46 104 104v72H258z"
          fill="#FFF0D8"/>
    <rect x="218" y="390" width="588" height="390" rx="92"
          fill="url(#wallet)" stroke="#FFD69A" stroke-width="18"/>
    <path d="M278 458h460" stroke="#FFE8C7" stroke-width="14" stroke-linecap="round" opacity=".65"/>
    <path d="M586 514h220v192H586c-53 0-96-43-96-96s43-96 96-96z"
          fill="#713B25" stroke="#FFE0A8" stroke-width="16"/>
    <circle cx="598" cy="610" r="22" fill="#FFD47D"/>
  </g>

  <!-- Coin badge -->
  <circle cx="710" cy="300" r="132" fill="#24150F" opacity=".9"/>
  <circle cx="710" cy="300" r="112" fill="url(#coin)" stroke="#FFF4D9" stroke-width="12"/>
  <path d="M747 246c-13-14-31-21-54-21-35 0-60 18-60 46 0 25 18 37 59 46 39 8 57 20 57 47 0 30-27 50-66 50-27 0-50-9-68-28"
        fill="none" stroke="#713B25" stroke-width="20" stroke-linecap="round"/>
  <path d="M694 203v194" stroke="#713B25" stroke-width="17" stroke-linecap="round"/>

  <!-- Simple upward progress mark -->
  <path d="M310 680v-86M390 680v-132M470 680v-182"
        fill="none" stroke="#FFF7E9" stroke-width="28" stroke-linecap="round"/>
  <path d="M300 520l102-78 79 25 102-104"
        fill="none" stroke="#FFF7E9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M531 363h52v52"
        fill="none" stroke="#FFF7E9" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
</svg>